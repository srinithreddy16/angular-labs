<div class="container mt-4">
  <h2 class="text-center">Password Generator</h2>

  <div class="card mx-auto mt-3 p-4" style="max-width: 500px">
    <div class="mb-3">
      <label class="form-label">Password Length (4 - 50)</label>
      <input
        type="number"
        class="form-control"
        min="4"
        max="50"
        [(ngModel)]="length"
      />
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="uppercase" [(ngModel)]="includeUppercase" />
      <label class="form-check-label" for="uppercase">Uppercase letters (A-Z)</label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="lowercase" [(ngModel)]="includeLowercase" />
      <label class="form-check-label" for="lowercase">Lowercase letters (a-z)</label>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="numbers" [(ngModel)]="includeNumbers" />
      <label class="form-check-label" for="numbers">Numbers (0-9)</label>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="symbols" [(ngModel)]="includeSymbols" />
      <label class="form-check-label" for="symbols">Symbols (!@#$)</label>
    </div>

    <button class="btn btn-primary" (click)="generatePassword()">Generate Password</button>

    @if (errorMessage) {
      <p class="text-danger mt-3">{{ errorMessage }}</p>
    }

    @if (password) {
      <div class="mt-3">
        <label class="form-label">Generated Password</label>
        <div class="input-group">
          <input type="text" class="form-control" [value]="password" readonly />
          <button class="btn btn-success" (click)="copyPassword()">Copy</button>
        </div>
      </div>
    }

    @if (copyMessage) {
      <p class="text-success mt-2">{{ copyMessage }}</p>
    }
  </div>
</div>
