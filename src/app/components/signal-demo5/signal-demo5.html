<h3 class="text-center">SignalDemo5 - FilteredFruits</h3>
<div class="border border-3 rounded-3 m-3 p-3">
    <input
        type="text"
        class="form-control mb-3"
        placeholder="Search fruits..."
        [value]="searchText()"
        (input)="changeSearchText($event)"
    />

    <ul>
        @for (fruit of filteredFruits(); track fruit){
            <li> {{ fruit }} </li>
        } @empty {
            <li>No fruits found</li>
        }
    </ul>
</div>
