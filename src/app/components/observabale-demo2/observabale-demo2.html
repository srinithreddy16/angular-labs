<h3 class="text-center">Let's Learn Observable</h3>

<div class="border border-3 rounded-3 p-3 m-3">
  <h3>Current Time- {{currentTime$ | async}}</h3>
</div>

<div class="border border-3 rounded-3 p-3 m-3">
  <h4>number: {{numbers | async}}</h4>
  <h4>even_numbers: {{even_numbers | async}}</h4>
  <h4>square_numbers: {{square_numbers | async}}</h4>
</div>
