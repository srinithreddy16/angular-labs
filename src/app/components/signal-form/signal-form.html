<h3 class="text-center">Signal Form</h3>

<div class="col-sm-6 offset-3 border border-3 rounded-3 p-3">
  <p>Email: <input type="email" [formField]="loginForm.email" /></p>
  <p>Password: <input type="password" [formField]="loginForm.password" /></p>

  <div>Email: {{ loginForm.email().value() }}</div>

  <button type="button" class="btn btn-secondary mb-2" (click)="updateEmail()">
    Set Email
  </button>

  @if (loginForm.email().touched() && loginForm.email().invalid()) {
    <ul>
      @for (error of loginForm.email().errors(); track error) {
        <li>{{ error.message }}</li>
      }
    </ul>
  }
</div>
