<div class="container border border-2 p-2 m-2">
  <div class="row text-center">
    <div>This is Parent Component</div>
    <div>My own data a is {{ a }}</div>
    <div>My child2's data b is {{ child2.b }}</div>
    <div>My child2's data parentCourseName is {{ parentCourseName }}</div>
  </div>
  <div class="row">
    <div class="col-sm-6">
      <div class="border border-2 p-2 text-center">
        <app-child1-demo [a]="a" [b]="child2.b"></app-child1-demo>
      </div>
    </div>
    <div class="col-sm-6">
      <div class="border border-2 p-2 text-center">
        <app-child2-demo
          [aChild2]="a"
          #child2
          (courseNameEvent)="receiveDataFromChild($event)"
        ></app-child2-demo>
      </div>
    </div>
  </div>
</div>
